name: Add original Customers dataset
on:
  push:
    paths:
      - '.github/workflows/get-customers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Customers.csv from the official course dataset
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, json, pathlib, zipfile, io
          public_key = "https://disk.yandex.ru/d/SKOuU856U8TJUw"
          api = "https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=" + urllib.parse.quote(public_key, safe="")
          with urllib.request.urlopen(urllib.request.Request(api, headers={"User-Agent":"Mozilla/5.0"}),timeout=90) as req:
              href = json.load(req)["href"]
          with urllib.request.urlopen(urllib.request.Request(href, headers={"User-Agent":"Mozilla/5.0"}),timeout=180) as req:
              content = req.read()
          target = pathlib.Path("chapter_1_2/Customers.csv")
          if zipfile.is_zipfile(io.BytesIO(content)):
              with zipfile.ZipFile(io.BytesIO(content)) as archive:
                  candidates = [n for n in archive.namelist() if n.lower().endswith("customers.csv")]
                  if not candidates:
                      raise RuntimeError("Customers.csv not found in downloaded archive")
                  content = archive.read(candidates[0])
          if len(content) < 30_000_000 or b"Customer_id" not in content[:200]:
              raise RuntimeError("Downloaded dataset did not pass checks")
          target.write_bytes(content)
          print(f"Customers.csv saved ({len(content)} bytes)")
          PY
      - name: Commit original dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapter_1_2/Customers.csv
          if ! git diff --staged --quiet; then
            git commit -m "Add original Customers.csv dataset"
            git push
          fi
