name: Verify LazyPredict lab 2.3
on:
  push:
    paths:
      - '.github/workflows/verify-ex23.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run LazyPredict regression and classification
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import runpy
          import matplotlib
          matplotlib.use('Agg')
          from matplotlib import pyplot as plt
          plt.show = lambda: plt.close('all')
          runpy.run_path('chapter_1_2/ex23.py', run_name='__main__')
          print('All LazyPredict checks passed')
          PY
